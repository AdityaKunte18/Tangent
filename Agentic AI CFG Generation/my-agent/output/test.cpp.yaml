methods:
    - method:
          id: M1
          entry: N1
          exit: N3
          name: method001
          type: void
          nodes:
              N1:
                  type: entry
                  arguments: []
                  next: N2
              N2:
                  type: block
                  statements:
                      - int x = 1;
                      - int y = 2;
                      - cout << x + y << endl;
                  next: N3
              N3:
                  type: exit
                  return: []
                  next: null
    - method:
          id: M2
          entry: N1
          exit: N7
          name: method002
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: conditional
                  startPredicate: N2a
                  predicates:
                      - predicate:
                            ID: N2a
                            statement: x + y > 0
                            onTrue: N3
                            onFalse: N4
              N3:
                  type: block
                  statements:
                      - cout << "positive" << endl;
                  next: N5
              N4:
                  type: block
                  statements:
                      - cout << "negative" << endl;
                  next: N6
              N5:
                  type: block
                  statements:
                      - _return_value = 1;
                  next: N7
              N6:
                  type: block
                  statements:
                      - _return_value = 0;
                  next: N7
              N7:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
    - method:
          id: M3
          entry: N1
          exit: N5
          name: method003
          type: string
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: conditional
                  startPredicate: N2a
                  predicates:
                      - predicate:
                            ID: N2a
                            statement: x > 0 || y < 0
                            onTrue: N3
                            onFalse: N4
              N3:
                  type: block
                  statements:
                      - _return_value = "first true";
                  next: N5
              N4:
                  type: conditional
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: x < 0 && y > 0
                            onTrue: N6
                            onFalse: N7
              N5:
                  type: exit
                  return:
                      - name: _return_value
                        type: string
                  next: null
              N6:
                  type: block
                  statements:
                      - _return_value = "second true";
                  next: N5
              N7:
                  type: block
                  statements:
                      - _return_value = "both false";
                  next: N5
    - method:
          id: M4
          entry: N1
          exit: N5
          name: method004
          type: string
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: conditional
                  startPredicate: N2a
                  predicates:
                      - predicate:
                            ID: N2a
                            statement: "!(x > y) && (x + y < 0 || x*y <= 0)"
                            onTrue: N3
                            onFalse: N4
              N3:
                  type: block
                  statements:
                      - _return_value = format("The values of x and y are {} and {}\n", x, y);
                  next: N5
              N4:
                  type: block
                  statements:
                      - _return_value = "other";
                  next: N5
              N5:
                  type: exit
                  return:
                      - name: _return_value
                        type: string
                  next: null
    - method:
          id: M5
          entry: N1
          exit: N7
          name: method005
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - int loopCounter = 0;
                  next: N3
              N3:
                  type: loop
                  iteratorStart: null
                  iteratorUpdate: null
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: i < y
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: block
                  statements:
                      - loopCounter++;
                  next: N6
              N5:
                  type: block
                  statements:
                      - _return_value = loopCounter;
                  next: N7
              N6:
                  type: conditional
                  startPredicate: N6a
                  predicates:
                      - predicate:
                            ID: N6a
                            statement: loopCounter % 5
                            onTrue: N8
                            onFalse: N9
              N7:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
              N8:
                  type: block
                  statements:
                      - loopCounter += 2;
                  next: N9
              N9:
                  type: block
                  statements:
                      - i += x
                  next: N3
    - method:
          id: M6
          entry: N1
          exit: N6
          name: method006
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - int loopCounter = 0;
                  next: N3
              N3:
                  type: conditional
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: x > 0 && y > 0
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: loop
                  iteratorStart: null
                  iteratorUpdate: null
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: loopCounter < (x + y)
                            onTrue: N7
                            onFalse: N8
              N5:
                  type: block
                  statements:
                      - _return_value = -1;
                  next: N6
              N6:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
              N7:
                  type: block
                  statements:
                      - loopCounter++;
                  next: N4
              N8:
                  type: block
                  statements:
                      - _return_value = loopCounter;
                  next: N6
    - method:
          id: M7
          entry: N1
          exit: N6
          name: method007
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - int loopCounter = 0;
                  next: N3
              N3:
                  type: loop
                  iteratorStart: int i = 0
                  iteratorUpdate: null
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: i < y
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: loop
                  iteratorStart: int j = x
                  iteratorUpdate: null
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: j >= 0
                            onTrue: N7
                            onFalse: N8
              N5:
                  type: block
                  statements:
                      - _return_value = loopCounter;
                  next: N6
              N6:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
              N7:
                  type: conditional
                  startPredicate: N7a
                  predicates:
                      - predicate:
                            ID: N7a
                            statement: j == i
                            onTrue: N9
                            onFalse: N10
              N8:
                  type: block
                  statements:
                      - i ++
                  next: N3
              N9:
                  type: block
                  statements:
                      - loopCounter += 2;
                  next: N11
              N10:
                  type: block
                  statements:
                      - loopCounter += 3;
                  next: N11
              N11:
                  type: block
                  statements:
                      - j --
                  next: N4
    - method:
          id: M8
          entry: N1
          exit: N6
          name: method008
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - int loopCounter = 0;
                      - int other = 0;
                  next: N3
              N3:
                  type: block
                  statements:
                      - loopCounter ++;
                      - other += (loopCounter + y);
                  next: N4
              N4:
                  type: loop
                  iteratorStart: null
                  iteratorUpdate: null
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: loopCounter % x == other
                            onTrue: N3
                            onFalse: N5
              N5:
                  type: block
                  statements:
                      - _return_value = loopCounter;
                  next: N6
              N6:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
    - method:
          id: M9
          entry: N1
          exit: N7
          name: method009
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - int loopCounter = 0;
                  next: N3
              N3:
                  type: loop
                  iteratorStart: null
                  iteratorUpdate: null
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: "true"
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: block
                  statements:
                      - loopCounter++;
                  next: N6
              N5:
                  type: block
                  statements:
                      - _return_value = loopCounter;
                  next: N7
              N6:
                  type: conditional
                  startPredicate: N6a
                  predicates:
                      - predicate:
                            ID: N6a
                            statement: loopCounter + x == y
                            onTrue: N8
                            onFalse: N3
              N7:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
              N8:
                  type: jump
                  next: N5
