methods:
    - method:
          id: M1
          entry: N1
          exit: N3
          name: basic
          type: void
          nodes:
              N1:
                  type: entry
                  arguments: []
                  next: N2
              N2:
                  type: block
                  statements:
                      - int x = 1;
                      - int y = 2;
                      - System.out.println(x + y);
                  next: N3
              N3:
                  type: exit
                  return: []
                  next: null
    - method:
          id: M2
          entry: N1
          exit: N6
          name: decrement
          type: int
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: start_number
                        type: int
                      - name: times
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - int value = start_number;
                  next: N3
              N3:
                  type: loop
                  iteratorStart: int i = 0
                  iteratorUpdate: i++
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: i < times
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: block
                  statements:
                      - value--;
                  next: N3
              N5:
                  type: block
                  statements:
                      - _return_value = value;
                  next: N6
              N6:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
    - method:
          id: M3
          entry: N1
          exit: N5
          name: conditional1
          type: boolean
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: conditional
                  startPredicate: N2a
                  predicates:
                      - predicate:
                            ID: N2a
                            statement: x + y > 0
                            onTrue: N3
                            onFalse: N4
              N3:
                  type: block
                  statements:
                      - System.out.println("positive")
                      - "_return_value = true; /* synthetic */ "
                  next: N5
              N4:
                  type: block
                  statements:
                      - System.out.println("negative")
                      - "_return_value = false; /* synthetic */ "
                  next: N5
              N5:
                  type: exit
                  return:
                      - name: _return_value
                        type: boolean
                  next: null
    - method:
          id: M4
          entry: N1
          exit: N5
          name: conditional2
          type: void
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: x
                        type: int
                      - name: y
                        type: int
                  next: N2
              N2:
                  type: conditional
                  startPredicate: N2a
                  predicates:
                      - predicate:
                            ID: N2a
                            statement: x > 0 || y < 0
                            onTrue: N3
                            onFalse: N4
              N3:
                  type: block
                  statements:
                      - System.out.println("first true")
                  next: N5
              N4:
                  type: conditional
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: x < 0 && y > 0
                            onTrue: N6
                            onFalse: N7
              N5:
                  type: exit
                  return: []
                  next: null
              N6:
                  type: block
                  statements:
                      - System.out.println("second true")
                  next: N5
              N7:
                  type: block
                  statements:
                      - System.out.println("both false")
                  next: N5
