methods:
    - method:
          id: M1
          entry: N1
          exit: N5
          name: dfsRec
          type: void
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: adj
                        type: vector<vector<int>> &
                      - name: visited
                        type: vector<bool> &
                      - name: s
                        type: int
                      - name: res
                        type: vector<int> &
                  next: N2
              N2:
                  type: block
                  statements:
                      - visited[s] = true;
                      - res.push_back(s);
                  next: N3
              N3:
                  type: loop
                  iteratorStart: null
                  iteratorUpdate: null
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: "int i : adj[s]"
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: conditional
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: visited[i] == false
                            onTrue: N6
                            onFalse: N3
              N5:
                  type: exit
                  return: []
                  next: null
              N6:
                  type: block
                  statements:
                      - dfsRec(adj, visited, i, res);
                  next: N3
    - method:
          id: M2
          entry: N1
          exit: N4
          name: dfs
          type: vector<int>
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: adj
                        type: vector<vector<int>> &
                  next: N2
              N2:
                  type: block
                  statements:
                      - vector<bool> visited(adj.size(), false);
                      - vector<int> res;
                      - dfsRec(adj, visited, 0, res);
                  next: N3
              N3:
                  type: block
                  statements:
                      - _return_value = res;
                  next: N4
              N4:
                  type: exit
                  return:
                      - name: _return_value
                        type: vector<int>
                  next: null
    - method:
          id: M3
          entry: N1
          exit: N3
          name: addEdge
          type: void
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: adj
                        type: vector<vector<int>>&
                      - name: u
                        type: int
                      - name: v
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - adj[u].push_back(v);
                      - adj[v].push_back(u);
                  next: N3
              N3:
                  type: exit
                  return: []
                  next: null
    - method:
          id: M4
          entry: N1
          exit: N7
          name: main
          type: int
          nodes:
              N1:
                  type: entry
                  arguments: []
                  next: N2
              N2:
                  type: block
                  statements:
                      - int V = 5;
                      - vector<vector<int>> adj(V);
                  next: N3
              N3:
                  type: block
                  statements:
                      - addEdge(adj, 1, 2);
                      - addEdge(adj, 1, 0);
                      - addEdge(adj, 2, 0);
                      - addEdge(adj, 2, 3);
                      - addEdge(adj, 2, 4);
                  next: N4
              N4:
                  type: block
                  statements:
                      - vector<int> res = dfs(adj);
                  next: N5
              N5:
                  type: loop
                  iteratorStart: int i = 0
                  iteratorUpdate: null
                  startPredicate: N5a
                  predicates:
                      - predicate:
                            ID: N5a
                            statement: i < V
                            onTrue: N6
                            onFalse: N7
              N6:
                  type: block
                  statements:
                      - cout << res[i] << " ";
                  next: N8
              N7:
                  type: exit
                  return:
                      - name: _return_value
                        type: int
                  next: null
              N8:
                  type: block
                  statements:
                      - i++
                  next: N5
