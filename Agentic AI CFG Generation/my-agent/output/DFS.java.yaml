methods:
    - method:
          id: M1
          entry: N1
          exit: N5
          name: dfsRecursive
          type: void
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: adj
                        type: ArrayList<ArrayList<Integer>>
                      - name: visted
                        type: boolean[]
                      - name: s
                        type: int
                      - name: res
                        type: ArrayList<Integer>
                  next: N2
              N2:
                  type: block
                  statements:
                      - visted[s] = true;
                      - res.add(s);
                  next: N3
              N3:
                  type: loop
                  iteratorStart: null
                  iteratorUpdate: null
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: "int i : adj.get(s)"
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: conditional
                  startPredicate: N4a
                  predicates:
                      - predicate:
                            ID: N4a
                            statement: "!visted[i]"
                            onTrue: N6
                            onFalse: N3
              N5:
                  type: exit
                  return: []
                  next: null
              N6:
                  type: block
                  statements:
                      - dfsRecursive(adj, visted, i, res);
                  next: N3
    - method:
          id: M2
          entry: N1
          exit: N4
          name: dfs
          type: ArrayList<Integer>
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: adj
                        type: ArrayList<ArrayList<Integer>>
                  next: N2
              N2:
                  type: block
                  statements:
                      - boolean[] visited = new boolean[adj.size()];
                      - ArrayList<Integer> res = new ArrayList<>();
                      - dfsRecursive(adj, visited, 0, res);
                  next: N3
              N3:
                  type: block
                  statements:
                      - _return_value = res;
                  next: N4
              N4:
                  type: exit
                  return:
                      - name: _return_value
                        type: ArrayList<Integer>
                  next: null
    - method:
          id: M3
          entry: N1
          exit: N3
          name: addEdge
          type: unknown
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: adj
                        type: ArrayList<ArrayList<Integer>>
                      - name: u
                        type: int
                      - name: v
                        type: int
                  next: N2
              N2:
                  type: block
                  statements:
                      - adj.get(u).add(v);
                      - adj.get(v).add(u);
                  next: N3
              N3:
                  type: exit
                  return:
                      - name: _return_value
                        type: unknown
                  next: null
    - method:
          id: M4
          entry: N1
          exit: N10
          name: main
          type: void
          nodes:
              N1:
                  type: entry
                  arguments:
                      - name: args
                        type: String[]
                  next: N2
              N2:
                  type: block
                  statements:
                      - int V = 5;
                      - ArrayList<ArrayList<Integer>> adj = new ArrayList<>();
                  next: N3
              N3:
                  type: loop
                  iteratorStart: int i = 0
                  iteratorUpdate: null
                  startPredicate: N3a
                  predicates:
                      - predicate:
                            ID: N3a
                            statement: i < V
                            onTrue: N4
                            onFalse: N5
              N4:
                  type: block
                  statements:
                      - adj.add(new ArrayList<>());
                  next: N6
              N5:
                  type: block
                  statements:
                      - addEdge(adj, 1, 2);
                      - addEdge(adj, 1, 0);
                      - addEdge(adj, 2, 0);
                      - addEdge(adj, 2, 3);
                      - addEdge(adj, 2, 4);
                  next: N7
              N6:
                  type: block
                  statements:
                      - i++
                  next: N3
              N7:
                  type: block
                  statements:
                      - ArrayList<Integer> res = dfs(adj);
                  next: N8
              N8:
                  type: loop
                  iteratorStart: int i = 0
                  iteratorUpdate: null
                  startPredicate: N8a
                  predicates:
                      - predicate:
                            ID: N8a
                            statement: i < res.size()
                            onTrue: N9
                            onFalse: N10
              N9:
                  type: block
                  statements:
                      - System.out.print(res.get(i) + " ");
                  next: N11
              N10:
                  type: exit
                  return: []
                  next: null
              N11:
                  type: block
                  statements:
                      - i++
                  next: N8
